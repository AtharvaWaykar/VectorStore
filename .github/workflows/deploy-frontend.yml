name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: VectorStoreWeb/package-lock.json
      - run: npm ci
        working-directory: VectorStoreWeb
      - run: npm test
        working-directory: VectorStoreWeb
      - run: npm run build
        working-directory: VectorStoreWeb
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          working-directory: VectorStoreWeb
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_LOCAL_EMBEDDINGS: 'true'
          VITE_MATCH_ITEMS_RPC: match_items
