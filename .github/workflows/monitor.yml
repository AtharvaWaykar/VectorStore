name: Production monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check deployed app
        env:
          SMOKE_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          test -n "$SMOKE_URL"
          node VectorStoreWeb/scripts/integration-smoke.mjs
      - if: failure()
        name: Open or update incident issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production monitoring is failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-monitoring',
            });
            const body = `The scheduled production smoke check failed in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`;
            if (issues.some(issue => issue.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues.find(issue => issue.title === title).number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['production-monitoring'] });
            }
